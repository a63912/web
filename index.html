<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>民宿網站</title>

<style>
body {
  margin: 0;
  font-family: "Arial", sans-serif;
  background: #f7f6f2;
  color: #2f3e2f;
}

nav {
  display: flex;
  justify-content: center;
  gap: 20px;
  padding: 15px;
  background: #eaf3ea;
  position: sticky;
  top: 0;
}

nav button {
  border: none;
  background: none;
  font-size: 16px;
  cursor: pointer;
  color: #2f3e2f;
}

nav button:hover {
  color: #4a7c59;
}

.page {
  display: none;
  padding: 20px;
}

.page.active {
  display: block;
}

.hero {
  position: relative;
}

.hero img {
  width: 100%;
  height: 400px;
  object-fit: cover;
  border-radius: 10px;
}

.booking {
  position: absolute;
  top: 15px;
  right: 15px;
  background: #6aa84f;
  color: white;
  padding: 10px 15px;
  border-radius: 8px;
  text-decoration: none;
}

.lang-btn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: #a8c3a8;
  border: none;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
}

.gallery {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.room {
  flex: 1;
  text-align: center;
}

.room img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 10px;
}
</style>
</head>

<body>

<nav>
  <button onclick="showPage('home')">首頁</button>
  <button onclick="showPage('yuye')">嶼野</button>
  <button onclick="showPage('xiaomilu')">小謎路</button>
  <button onclick="showPage('weiguang')">微光</button>
  <button onclick="showPage('muguang')">沐光</button>
</nav>

<!-- ===== 首頁 ===== -->
<div id="home" class="page active">
  <div class="hero">
    <a class="booking" href="https://www.gges.tp.edu.tw/nss/p/index" target="_blank">訂房</a>
    <img src="https://picsum.photos/1200/600?random=1">
  </div>
</div>

<!-- ===== 嶼野 ===== -->
<div id="yuye" class="page">
  <div class="hero">
    <a class="booking" href="https://www.ntnu.edu.tw/" target="_blank">訂房</a>
    <img src="https://picsum.photos/1200/600?random=2">
  </div>

  <img src="https://picsum.photos/1200/500?random=3" style="width:100%; margin-top:10px; border-radius:10px;">

  <div class="gallery">
    <div class="room">
      <img id="yuye1">
      <div>4人房</div>
    </div>
    <div class="room">
      <img id="yuye2">
      <div>2人房</div>
    </div>
    <div class="room">
      <img id="yuye3">
      <div>4人雅房</div>
    </div>
  </div>
</div>

<!-- ===== 小謎路 ===== -->
<div id="xiaomilu" class="page">
  <div class="hero">
    <a class="booking" href="https://acc.ntue.edu.tw/APSWIS_Q/Login_L_Q.asp" target="_blank">訂房</a>
    <img src="https://picsum.photos/1200/600?random=4">
  </div>

  <img src="https://picsum.photos/1200/500?random=5" style="width:100%; margin-top:10px; border-radius:10px;">

  <div class="gallery">
    <div class="room"><img id="xm1"><div>4人房</div></div>
    <div class="room"><img id="xm2"><div>2人房</div></div>
    <div class="room"><img id="xm3"><div>4人雅房</div></div>
  </div>
</div>

<!-- ===== 微光 ===== -->
<div id="weiguang" class="page">
  <div class="hero">
    <a class="booking" href="https://sso.ntue.edu.tw/" target="_blank">訂房</a>
    <img src="https://picsum.photos/1200/600?random=6">
  </div>

  <img src="https://picsum.photos/1200/500?random=7" style="width:100%; margin-top:10px; border-radius:10px;">

  <div class="gallery">
    <div class="room"><img id="wg1"><div>4人房</div></div>
    <div class="room"><img id="wg2"><div>2人房</div></div>
    <div class="room"><img id="wg3"><div>4人雅房</div></div>
  </div>
</div>

<!-- ===== 沐光 ===== -->
<div id="muguang" class="page">
  <div class="hero">
    <a class="booking" href="https://cashier.ntue.edu.tw/Login.aspx" target="_blank">訂房</a>
    <img src="https://picsum.photos/1200/600?random=8">
  </div>

  <img src="https://picsum.photos/1200/500?random=9" style="width:100%; margin-top:10px; border-radius:10px;">

  <div class="gallery">
    <div class="room"><img id="mg1"><div>4人房</div></div>
    <div class="room"><img id="mg2"><div>2人房</div></div>
    <div class="room"><img id="mg3"><div>4人雅房</div></div>
  </div>
</div>

<!-- 語言切換 -->
<button class="lang-btn" onclick="toggleLang()">中文 / English</button>

<script>
let lang = "zh";

const text = {
  zh: {},
  en: {}
};

function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== 自動輪播 =====
function carousel(id, seed){
  let i = 0;
  setInterval(() => {
    document.getElementById(id).src =
      `https://picsum.photos/400/300?random=${seed + i}`;
    i++;
  }, 2000);
}

// 初始化輪播
carousel("yuye1", 10);
carousel("yuye2", 20);
carousel("yuye3", 30);

carousel("xm1", 40);
carousel("xm2", 50);
carousel("xm3", 60);

carousel("wg1", 70);
carousel("wg2", 80);
carousel("wg3", 90);

carousel("mg1", 100);
carousel("mg2", 110);
carousel("mg3", 120);

// 語言切換（簡化版示意）
function toggleLang(){
  lang = (lang === "zh") ? "en" : "zh";

  const map = {
    zh: ["首頁","嶼野","小謎路","微光","沐光"],
    en: ["Home","Yuye","Xiaomilu","Glow Path","Soft Light"]
  };

  document.querySelectorAll("nav button").forEach((btn, i) => {
    btn.textContent = map[lang][i];
  });
}
</script>

</body>
</html>
